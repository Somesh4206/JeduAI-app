<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JeduAI — Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    background: #f8f9ff; color: #202343;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    max-width: 360px; width: 100%; text-align: center;
    background: #fff; border: 1px solid #e6e9f7; border-radius: 28px;
    padding: 40px 28px; box-shadow: 0 12px 40px rgba(91, 95, 239, .08);
  }
  .logo {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
    background: linear-gradient(135deg, #5b5fef, #773de8);
    color: #fff; font-weight: 900; font-size: 42px;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 20px; font-weight: 900; }
  p { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #6b6f95; }
  button {
    margin-top: 22px; width: 100%; min-height: 48px; border: 0; border-radius: 18px;
    background: linear-gradient(135deg, #5b5fef, #773de8); color: #fff;
    font-size: 15px; font-weight: 800; cursor: pointer;
  }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">J</div>
    <h1>You're offline</h1>
    <p>JeduAI needs an internet connection to load your learning content. Check your connection, then try again.</p>
    <button onclick="location.replace('/')">Try again</button>
  </div>
</body>
</html>
